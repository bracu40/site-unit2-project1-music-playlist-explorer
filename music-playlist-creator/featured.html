<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Playlist | Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-bar">
            <h1>Music Playlist Explorer</h1>
            <div class="songs-right">
                <a class="nav-link active" href="featured.html">Featured</a>
                <a class="nav-link" href="index.html">All</a>
            </div>
        </nav>
    </header>

    <main class="featured-main">
        <section class="featured-layout" id="featured-layout">
            <article class="featured-meta" id="featured-meta">
                <img id="featured-cover" src="assets/img/playlist.png" alt="Featured playlist cover">
                <h2 id="featured-title">Loading featured playlist...</h2>
                <p id="featured-creator"></p>
                <button id="new-featured-button" type="button">New Featured Playlist</button>
            </article>

            <section class="featured-songs-panel" aria-labelledby="featured-songs-heading">
                <h3 id="featured-songs-heading">Songs</h3>
                <ul id="featured-song-list"></ul>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <script src="featured.js"></script>
</body>
</html>
